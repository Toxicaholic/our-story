<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Наша история ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #00e5a3;
      --black: #111418;
      --card-bg: #ffffff;
      --bg-white: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-white);
      font-family: 'Montserrat', sans-serif;
      color: var(--black);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновый холст с жирными мятными и чёрными линиями */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Белая карточка с полужирной чёрной окантовкой */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 3px solid var(--black);
      border-radius: 36px;
      padding: 36px 26px;
      width: 100%;
      max-width: 560px;
      box-shadow: 10px 14px 0px var(--black);
      text-align: center;
    }

    /* Сердечко с Человеком-пауком */
    .spidey-heart-container {
      margin: 0 auto 16px;
      width: 84px;
      height: 84px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spidey-heart {
      width: 76px;
      height: 76px;
      animation: heartbeat 1.35s infinite ease-in-out;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.15));
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.18) rotate(-2deg); }
      28% { transform: scale(1); }
      42% { transform: scale(1.12) rotate(2deg); }
      70% { transform: scale(1); }
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--black);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    /* Большое окно для фото с чёрной окантовкой */
    .slider-wrapper {
      position: relative;
      width: 100%;
      max-width: 510px;
      height: 450px;
      margin: 0 auto 24px auto;
      border-radius: 24px;
      overflow: hidden;
      background: #f1f3f5;
      border: 2.5px solid var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slider-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slider-img.active {
      opacity: 1;
    }

    .placeholder-text {
      color: #868e96;
      font-size: 15px;
      padding: 20px;
      font-weight: 600;
    }

    /* Сетка счетчика */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 26px;
    }

    .timer-item {
      background: #ffffff;
      border: 2px solid var(--black);
      border-radius: 18px;
      padding: 12px 4px;
      box-shadow: 3px 4px 0px var(--black);
      transition: transform 0.2s ease;
    }

    .timer-item:hover {
      transform: translateY(-2px);
    }

    .timer-val {
      font-size: 26px;
      font-weight: 900;
      color: var(--black);
    }

    .timer-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #495057;
      margin-top: 4px;
      font-weight: 700;
    }

    /* Стильная органичная плашка "Это лишь начало" */
    .lead-phrase {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--black);
      padding: 10px 22px;
      border-radius: 999px;
      background: #ffffff;
      border: 2px solid var(--black);
      box-shadow: 3px 4px 0px var(--black);
    }

    .lead-phrase::before {
      content: "";
      width: 9px;
      height: 9px;
      background: var(--mint);
      border: 2px solid var(--black);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Фон: перемещающиеся жирные мятные и чёрные линии с закруглениями -->
  <canvas id="bg-canvas"></canvas>

  <div class="card">
    
    <!-- Сердце с Человеком-пауком -->
    <div class="spidey-heart-container">
      <svg class="spidey-heart" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="heart-clip">
            <path d="M50 88.5 C25 71 5 53 5 31.5 C5 15.5 17.5 5 32 5 C40 5 46.5 9 50 15 C53.5 9 60 5 68 5 C82.5 5 95 15.5 95 31.5 C95 53 75 71 50 88.5 Z" />
          </clipPath>
          <linearGradient id="spider-red-grad" x1="0" y1="0" x2="0" y2="100%">
            <stop offset="0%" stop-color="#ff2a55" />
            <stop offset="100%" stop-color="#cc0029" />
          </linearGradient>
        </defs>

        <!-- Внутренняя часть маски -->
        <g clip-path="url(#heart-clip)">
          <rect width="100" height="100" fill="url(#spider-red-grad)" />

          <!-- Паутина -->
          <path d="M50 8 L50 85 M10 40 L90 40 M20 20 L80 80 M20 80 L80 20" stroke="#111418" stroke-width="1.6" opacity="0.45" />
          <ellipse cx="50" cy="45" rx="16" ry="14" fill="none" stroke="#111418" stroke-width="1.6" opacity="0.4" />
          <ellipse cx="50" cy="45" rx="30" ry="26" fill="none" stroke="#111418" stroke-width="1.6" opacity="0.4" />

          <!-- Глаза-линзы Человека-паука -->
          <path d="M22 34 Q32 32 44 45 Q36 53 25 47 Q19 41 22 34 Z" fill="#111418" />
          <path d="M25 36 Q33 34 42 44 Q35 50 27 46 Q22 41 25 36 Z" fill="#ffffff" />
          
          <path d="M78 34 Q68 32 56 45 Q64 53 75 47 Q81 41 78 34 Z" fill="#111418" />
          <path d="M75 36 Q67 34 58 44 Q65 50 73 46 Q78 41 75 36 Z" fill="#ffffff" />
        </g>

        <!-- Чёрный полужирный контур сердца -->
        <path d="M50 88.5 C25 71 5 53 5 31.5 C5 15.5 17.5 5 32 5 C40 5 46.5 9 50 15 C53.5 9 60 5 68 5 C82.5 5 95 15.5 95 31.5 C95 53 75 71 50 88.5 Z" 
              fill="none" stroke="#111418" stroke-width="3.5" />
      </svg>
    </div>

    <h1>Наша история</h1>

    <!-- Большое окно для фото -->
    <div class="slider-wrapper" id="slider">
      <div class="placeholder-text" id="placeholder">Загрузка воспоминаний... ✨</div>
    </div>

    <!-- Таймер времени вместе -->
    <div class="timer-grid">
      <div class="timer-item">
        <div class="timer-val" id="days">0</div>
        <div class="timer-label" id="days-label">дней</div>
      </div>
      <div class="timer-item">
        <div class="timer-val" id="hours">0</div>
        <div class="timer-label" id="hours-label">часов</div>
      </div>
      <div class="timer-item">
        <div class="timer-val" id="mins">0</div>
        <div class="timer-label" id="mins-label">минут</div>
      </div>
      <div class="timer-item">
        <div class="timer-val" id="secs">0</div>
        <div class="timer-label" id="secs-label">секунд</div>
      </div>
    </div>

    <!-- Фраза "Это лишь начало" -->
    <div class="lead-phrase">Это лишь начало</div>

  </div>

  <script>
    // ==========================================
    // ⚙️ НАСТРОЙКИ (ЗАМЕНИ НА СВОИ ДАННЫЕ)
    // ==========================================
    const GITHUB_USERNAME = 'Toxicaholic';
    const GITHUB_REPO = 'our-story'; 

    // Задавайте дату в формате ДД.ММ.ГГГГ (можно с часами и минутами: '23.06.2026 18:00')
    const DATE_STRING = '01.07.2026'; 

    // Преобразование строки ДД.ММ.ГГГГ в дату
    function parseDate(str) {
      const [datePart, timePart = '00:00:00'] = str.trim().split(' ');
      const [day, month, year] = datePart.split('.').map(Number);
      const [hours = 0, mins = 0, secs = 0] = timePart.split(':').map(Number);
      return new Date(year, month - 1, day, hours, mins, secs);
    }

    const START_DATE = parseDate(DATE_STRING);
    // ==========================================
    // Счётчик времени
    function declension(num, words) {
      const cases = [2, 0, 1, 1, 1, 2];
      return words[(num % 100 > 4 && num % 100 < 20) ? 2 : cases[(num % 10 < 5) ? num % 10 : 5]];
    }

    function updateTimer() {
      const now = new Date();
      const diff = Math.max(0, now - START_DATE);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / 1000 / 60) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("mins").innerText = mins;
      document.getElementById("secs").innerText = secs;

      document.getElementById("days-label").innerText = declension(days, ["день", "дня", "дней"]);
      document.getElementById("hours-label").innerText = declension(hours, ["час", "часа", "часов"]);
      document.getElementById("mins-label").innerText = declension(mins, ["минута", "минуты", "минут"]);
      document.getElementById("secs-label").innerText = declension(secs, ["секунда", "секунды", "секунд"]);
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // Автоматическая загрузка фото из репозитория
    async function loadPhotos() {
      const slider = document.getElementById("slider");
      const placeholder = document.getElementById("placeholder");
      
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/photos`);
        if (!res.ok) throw new Error("Папка photos пуста");
        
        const files = await res.json();
        const photos = files.filter(f => f.name.match(/\.(jpg|jpeg|png|webp|gif)$/i));

        if (photos.length === 0) {
          placeholder.innerText = "Отправьте фото боту, чтобы они появились здесь ✨";
          return;
        }

        placeholder.remove();

        photos.forEach((photo, idx) => {
          const img = document.createElement("img");
          img.src = photo.download_url;
          img.className = `slider-img ${idx === 0 ? 'active' : ''}`;
          slider.appendChild(img);
        });

        if (photos.length > 1) {
          let currentIndex = 0;
          const images = slider.querySelectorAll(".slider-img");
          
          setInterval(() => {
            images[currentIndex].classList.remove("active");
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].classList.add("active");
          }, 4000);
        }

      } catch (e) {
        placeholder.innerText = "Жду фотографии из Telegram-бота 💌";
      }
    }

    loadPhotos();

    // ==========================================
    // 🎨 ЖИРНЫЕ ЗАКРУГЛЕННЫЕ МЯТНЫЕ И ЧЁРНЫЕ ЛИНИИ
    // ==========================================
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Палитра: сочный мятный и угольно-чёрный
    const strokeColors = [
      "#00e5a3",
      "#00e5a3",
      "#111418",
      "#111418",
      "#00c78e"
    ];

    class ThickRibbon {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.angle = Math.random() * Math.PI * 2;
        this.angleSpeed = (Math.random() - 0.5) * 0.04;
        this.speed = 1.5 + Math.random() * 2.2;
        this.color = strokeColors[Math.floor(Math.random() * strokeColors.length)];
        this.history = [];
        this.maxHistory = 35 + Math.floor(Math.random() * 30);
        // Жирная толщина линий: от 12px до 24px
        this.lineWidth = 12 + Math.random() * 12;
      }

      update() {
        this.angle += this.angleSpeed;
        if (Math.random() < 0.03) {
          this.angleSpeed = (Math.random() - 0.5) * 0.07;
        }

        this.x += Math.cos(this.angle) * this.speed + this.vx;
        this.y += Math.sin(this.angle) * this.speed + this.vy;

        this.history.push({ x: this.x, y: this.y });
        if (this.history.length > this.maxHistory) {
          this.history.shift();
        }

        if (this.x < -150 || this.x > width + 150 || this.y < -150 || this.y > height + 150) {
          this.reset();
        }
      }

      draw() {
        if (this.history.length < 3) return;

        ctx.beginPath();
        ctx.moveTo(this.history[0].x, this.history[0].y);

        for (let i = 1; i < this.history.length - 1; i++) {
          const xc = (this.history[i].x + this.history[i + 1].x) / 2;
          const yc = (this.history[i].y + this.history[i + 1].y) / 2;
          ctx.quadraticCurveTo(this.history[i].x, this.history[i].y, xc, yc);
        }

        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.lineWidth;
        ctx.lineCap = "round";   // Закруглённые концы линий
        ctx.lineJoin = "round";  // Закруглённые сочленения
        ctx.stroke();
      }
    }

    // Количество жирных линий
    const ribbons = Array.from({ length: 14 }, () => new ThickRibbon());

    function animate() {
      // Очистка белым фоном с лёгким шлейфом
      ctx.fillStyle = "rgba(248, 249, 250, 0.28)";
      ctx.fillRect(0, 0, width, height);

      ribbons.forEach(r => {
        r.update();
        r.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
